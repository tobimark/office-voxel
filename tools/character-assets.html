<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>人物资产导出 · PixOffice 方块办公室</title>
    <style>
      body{margin:0;padding:32px;background:#f8f9f5;color:#293635;font-family:'Microsoft YaHei',sans-serif}
      h1{font-size:20px;margin:0 0 8px}
      p{font:12px Consolas,monospace;color:#73817f;margin:0 0 6px}
      #gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}
      figure{margin:0;border:1px solid #dfe4dd;border-radius:6px;background:#fff;overflow:hidden}
      img{display:block;width:100%;image-rendering:pixelated}
      figcaption{padding:8px 10px;font-size:12px;color:#52666a}
    </style>
  </head>
  <body>
    <h1>人物资产导出</h1>
    <p id="status">正在准备…</p>
    <p>本页只做导出，不参与线上场景；由 <code>node scripts/export-characters.mjs</code> 驱动。</p>
    <div id="gallery"></div>
    <script type="module">
      import { characterAssets } from '../src/tools/character-assets.js';
      window.characterAssets = characterAssets;
      document.querySelector('#status').textContent =
        `已就绪：${characterAssets.summary} 个角色，等待落盘。`;
      // Optional human preview: open this page with ?preview=1 to render the first
      // few sheets. The export run skips it so it does not do the work twice.
      const gallery = document.querySelector('#gallery');
      const preview = new URLSearchParams(location.search).get('preview');
      if (preview) {
        const entries = preview === '1' ? characterAssets.roster.slice(0, 3)
          : characterAssets.roster.filter(entry => entry.id === preview);
        if (!entries.length) document.querySelector('#status').textContent = '未找到该外观。';
        for (const entry of entries) {
          const index = characterAssets.roster.indexOf(entry);
          const assets = await characterAssets.get(index);
          const figure = document.createElement('figure');
          const image = document.createElement('img');
          image.src = assets.sheet; image.alt = `${entry.name} 人物对照图`;
          const label = document.createElement('figcaption');
          label.textContent = `${entry.id} · ${entry.name} · ${entry.role}`;
          figure.append(image, label); gallery.append(figure);
        }
      }
    </script>
  </body>
</html>
